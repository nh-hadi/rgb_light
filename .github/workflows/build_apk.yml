name: Build Flutter Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android ARM64 Release APK
        run: flutter build apk --target-platform android-arm64 --release

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAmbientLight-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
